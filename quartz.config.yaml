# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Prometheus Vault
  # The browser tab shows `<note title><suffix>`, so the home note is titled
  # "Prometheus Vault" and this completes it to "Prometheus Vault | Private Viewing".
  # Sub-pages read "<note> | Private Viewing", which keeps tabs, bookmarks and history
  # distinguishable - a fixed site-wide title would make every one of them identical.
  pageTitleSuffix: " | Private Viewing"
  enableSPA: true
  enablePopovers: true
  # DISABLED DELIBERATELY. Do not set a provider on this site.
  #
  # `provider: plausible` was inherited unchanged from upstream's
  # quartz.config.default.yaml - it was never a choice made for this vault. Left on, it
  # injects a script from plausible.io into every page and calls plausible('pageview')
  # with `data-domain` set to `location.hostname` (see the emitter in
  # quartz/plugins/emitters/componentResources.ts). On a private vault that means the
  # host name and every note path visited are sent to a third party on every page view.
  #
  # Note that it needs no configured domain or key to do this - it reads the hostname at
  # run time - so "nothing is configured, therefore nothing leaks" is not true here.
  analytics: null
  locale: en-US
  baseUrl: localhost:8080
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Instrument Sans
      code: IBM Plex Mono
    colors:
      # Red Graphite: warm off-white canvas, graphite ink, brick-red accent.
      # Derived from seanwcom/Red-Graphite-for-Obsidian (base #292C2E, accent #cb4c48).
      # The accent is darkened for `secondary`/`tertiary` because Quartz uses those as
      # *link text* colour: the brand #cb4c48 lands at 4.07:1 on this canvas, under
      # WCAG AA. #c73f3b holds the same hue/saturation (2deg, 56%) at 4.51:1.
      #
      # The rejected alternative, kept here because it was built and compared: a Claude
      # cream variant from design-md/claude/DESIGN.md - canvas #faf9f5, lightgray
      # #e2dad1, gray #8e8b82, darkgray #3d3d3a, dark #141413, secondary #b55839,
      # tertiary #97492f; dark mode #181715 / #2e2c28 / #6c6a64 / #c8c4bb / #faf9f5 /
      # #d98b6f / #e8a55a.
      lightMode:
        light: "#f5f3f1"
        lightgray: "#ded8d1"
        gray: "#8b8580"
        darkgray: "#3c3f41"
        dark: "#292c2e"
        secondary: "#c73f3b"
        tertiary: "#a73330"
        highlight: rgba(199, 63, 59, 0.1)
        textHighlight: "#cb4c4855"
      darkMode:
        light: "#1f2224"
        lightgray: "#34383b"
        gray: "#6b7073"
        darkgray: "#d6d3d0"
        dark: "#eceae8"
        secondary: "#e0685f"
        tertiary: "#f08a80"
        highlight: rgba(224, 104, 95, 0.13)
        textHighlight: "#e0685f55"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        Prometheus Vault: /
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
        - author
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
